# Automated release: push a v* tag (via _ci/release.sh) → tests → real install-and-boot on DSH latest → npm publish → attach the tgz to a GitHub Release.
# npm publishing is trusted publishing (GitHub OIDC, no stored token): each package is registered once on npm as "release.yml from OrderG-X/<repo> may publish me".
# Every step is rerunnable: skip publish when the version already exists on npm; when the Release exists, only overwrite its assets.
# Triggering Run workflow manually without a tag = dry run: tests, packing, and the boot check run as usual, plus one identity check against npm, but nothing is published and no Release is created.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to re-release (e.g. v1.2.3); leave empty for a dry run without publishing'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Load plugin settings
        run: grep -vE '^\s*(#|$)' .github/plugin.env >> "$GITHUB_ENV"
      - name: Check tag matches package.json
        run: |
          NAME=$(node -p "require('./$PKG_DIR/package.json').name")
          VERSION=$(node -p "require('./$PKG_DIR/package.json').version")
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$DRY" = true ]; then echo "Dry run: ${NAME} ${VERSION}, not publishing"; exit 0; fi
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          [ "$TAG" = "v$VERSION" ] || { echo "::error::Tag $TAG does not match version $VERSION in $PKG_DIR/package.json"; exit 1; }
      - name: Test
        run: bash -ec "$TEST_CMD"
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          (cd "$PKG_DIR" && npm pack --pack-destination "$RUNNER_TEMP/out" --silent)
          PKG_TGZ=$(ls "$RUNNER_TEMP"/out/*.tgz | head -1)
          echo "PKG_TGZ=$PKG_TGZ" >> "$GITHUB_ENV"
          for a in $ASSETS; do cp "$PKG_TGZ" "$RUNNER_TEMP/out/$a"; done
          tar -tzf "$PKG_TGZ"
      - name: Install and boot in DSH latest
        run: node .github/dsh-compat.mjs "$PKG_TGZ" --dsh latest
      - name: Publish to npm
        run: |
          npm install -g npm@^11.5.1 --silent
          if [ "$DRY" = true ]; then
            # Dry run: exchange GitHub's identity token for a temporary npm publish token; getting one proves trusted publishing is configured (the token is neither used nor printed)
            ID=$(curl -sfS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | node -p 'JSON.parse(require("fs").readFileSync(0)).value')
            ESC=$(node -p 'process.argv[1].replace("/", "%2f")' "$NAME")
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $ID" "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$ESC")
            [ "$CODE" = 201 ] || { echo "::error::npm does not accept this repo's publish identity (HTTP $CODE): check the Trusted Publisher settings on npm"; exit 1; }
            echo "npm trusted publishing: identity verified (dry run, nothing published)"
          elif [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "${NAME}@${VERSION} already exists on npm; skipping publish"
          else
            case "$VERSION" in *-*) DIST=next ;; *) DIST=latest ;; esac
            npm publish "$PKG_TGZ" --access public --provenance --tag "$DIST"
          fi
      - name: GitHub Release
        if: env.DRY != 'true'
        run: |
          SUBJECT=$(git for-each-ref "refs/tags/$TAG" --format='%(contents:subject)')
          git for-each-ref "refs/tags/$TAG" --format='%(contents:body)' > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "$SUBJECT" > "$RUNNER_TEMP/notes.md"
          FILES=$(for a in $ASSETS; do printf '%s ' "$RUNNER_TEMP/out/$a"; done)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            case "$VERSION" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
            gh release create "$TAG" $FILES --verify-tag $PRE --title "$TAG — $SUBJECT" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          echo "### $NAME $VERSION published" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm: https://www.npmjs.com/package/$NAME/v/$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
