# Routine checks: tests on push / PR, plus a daily real install-and-boot of the plugin in DSH latest and next on macOS and Windows (the first place to turn red when a DSH upgrade breaks the plugin).
# Repos whose plugin.env defines TEST_CMD_WINDOWS also run the tests on Windows; repos defining E2E_CMD additionally run end-to-end tests on real macOS / Windows / Linux machines (e.g. the browser bridge driving a real Chrome).
# The template lives in dsh-plugins/_ci/ and is synced into five repos via _ci/sync.sh; the only per-repo difference is .github/plugin.env.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    outputs:
      e2e: ${{ steps.env.outputs.e2e }}
      wintest: ${{ steps.env.outputs.wintest }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Load plugin settings
        id: env
        run: |
          grep -vE '^\s*(#|$)' .github/plugin.env >> "$GITHUB_ENV"
          if grep -q '^E2E_CMD=.' .github/plugin.env; then echo e2e=true >> "$GITHUB_OUTPUT"; fi
          if grep -q '^TEST_CMD_WINDOWS=.' .github/plugin.env; then echo wintest=true >> "$GITHUB_OUTPUT"; fi
      - name: Test
        run: bash -ec "$TEST_CMD"
      - name: Pack
        working-directory: ${{ env.PKG_DIR }}
        run: npm pack --pack-destination "$RUNNER_TEMP" --silent
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/*.tgz
          retention-days: 7

  test-windows:
    needs: test
    if: needs.test.outputs.wintest == 'true'
    runs-on: windows-latest
    name: test · Windows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Load plugin settings
        shell: bash
        run: grep -vE '^\s*(#|$)' .github/plugin.env >> "$GITHUB_ENV"
      - name: Test
        shell: bash
        run: bash -ec "$TEST_CMD_WINDOWS"

  dsh:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        dsh: [latest, next]
    name: ${{ matrix.os == 'windows-latest' && 'Windows' || 'macOS' }} · DSH ${{ matrix.dsh }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Load plugin settings
        shell: bash
        run: grep -vE '^\s*(#|$)' .github/plugin.env >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: .pkg
      # A fresh DSH install on Windows (1.4 GB, 90k+ files) takes 10+ minutes: turn off real-time scanning, then cache the installed DSH CLI keyed by OS + actually resolved version.
      # New DSH release → version changes → cache miss → fresh install; the compat script also verifies the version and reinstalls on mismatch. The plugin itself is installed fresh every run.
      - name: Turn off Defender real-time scan
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - name: Resolve DSH version
        id: dsh
        if: runner.os == 'Windows'
        shell: bash
        run: |
          V=$(npm view "@deepseek-ai/dsh@${{ matrix.dsh }}" version --registry=https://registry.npmjs.org/ | tail -1 | tr -d "'\r") || V=
          echo "DSH ${{ matrix.dsh }} = ${V:-(not found; cache disabled)}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Restore DSH from cache
        id: cache
        if: steps.dsh.outputs.version
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dsh-cli
          key: dsh-cli-${{ runner.os }}-${{ runner.arch }}-node24-${{ steps.dsh.outputs.version }}
      # OSes outside PLATFORMS in plugin.env are informational only: failures are flagged in the summary but do not turn the whole check red
      - name: Install and boot in a fresh DSH
        shell: bash
        continue-on-error: ${{ !contains(env.PLATFORMS, runner.os) }}
        run: node .github/dsh-compat.mjs .pkg/*.tgz --dsh ${{ matrix.dsh }} ${{ steps.dsh.outputs.version && '--cli-dir "$RUNNER_TEMP/dsh-cli"' || '' }}
      # Save even if the plugin failed: a DSH CLI that did install is worth keeping
      - name: Save DSH to cache
        if: ${{ !cancelled() && steps.dsh.outputs.version && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/dsh-cli
          key: dsh-cli-${{ runner.os }}-${{ runner.arch }}-node24-${{ steps.dsh.outputs.version }}

  e2e:
    needs: test
    if: needs.test.outputs.e2e == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    name: E2E · ${{ matrix.os == 'windows-latest' && 'Windows' || matrix.os == 'ubuntu-latest' && 'Linux' || 'macOS' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Load plugin settings
        shell: bash
        run: grep -vE '^\s*(#|$)' .github/plugin.env >> "$GITHUB_ENV"
      # E2E also installs DSH fresh (90k+ files): drive C on Windows is slow (10 min vs. 1.5 min on drive D), so the temp dir moves to RUNNER_TEMP on drive D
      - name: Turn off Defender real-time scan, temp dir on drive D
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          Set-MpPreference -DisableRealtimeMonitoring $true
      - name: End-to-end on a real machine
        shell: bash
        continue-on-error: ${{ !contains(env.PLATFORMS, runner.os) }}
        run: bash -ec "$E2E_CMD"
