name: Bug report
description: Something is broken or not working as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Chinese or English is fine.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, what you expected
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: DSH and plugin versions, shown on the DSH Plugins page
      placeholder: yours, e.g. DSH 0.2.1-rc.5, plugin 1.5.2
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15.5
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Optional. Remove keys and private info first.
