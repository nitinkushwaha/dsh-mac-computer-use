name: Feature request
description: A new idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What you want
      description: What you are trying to do, and what gets in the way
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Optional. Screenshots or how other tools do it.
